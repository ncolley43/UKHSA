name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual run from the Actions tab (or npm run test:master) - pick the environment and, optionally, a sprint or user story
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: choice
        options: [ sit, e2e, live ]
        default: sit
      grep:
        description: 'Only run tests matching these tags, e.g. @S2 or "@S3 @US4" (leave blank for all)'
        type: string
        required: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Pushes and pull requests have no inputs, so they test SIT
      TEST_ENV: ${{ inputs.environment || 'sit' }}
      GREP: ${{ inputs.grep }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests (${{ inputs.environment || 'sit' }})
      run: |
        if [ -n "$GREP" ]; then
          npx playwright test --grep "$GREP"
        else
          npx playwright test
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload API request/response log
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: api-log
        path: api-results/api-log.json
        retention-days: 30
